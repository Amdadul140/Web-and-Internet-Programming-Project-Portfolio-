<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Skill Workshop Registration | DevStudio</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Top Headline Banner -->
    <div class="notification-banner">
        <span class="badge pulse-badge">INFO</span>
        <span class="banner-text">📌 Pick your skill and select a convenient Day and Time slot below.</span>
    </div>

    <!-- Header / Navbar -->
    <header class="navbar">
        <div class="logo-container">
            <svg class="logo-icon" width="40" height="40" viewBox="0 0 100 100">
                <rect width="100" height="100" rx="20" fill="var(--accent-color)"/>
                <path d="M30 30 L50 70 L70 30" stroke="#ffffff" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
                <circle cx="50" cy="30" r="6" fill="#ffffff"/>
            </svg>
            <span class="logo-text">DevStudio Registration</span>
        </div>
        <div class="nav-actions">
            <button id="themeToggle" class="theme-btn" aria-label="Toggle Theme">🌙</button>
            <a href="index.html" class="btn primary-btn">← Back to Portfolio</a>
        </div>
    </header>

    <!-- Workshop Registration Form Section -->
    <section class="section">
        <h2>Skill Session Registration</h2>
        <form id="registrationForm" class="card form-card" novalidate>
            <div class="form-group">
                <label for="regName">Full Name</label>
                <input type="text" id="regName" placeholder="Enter your full name" required>
                <small class="error-message" id="regNameError"></small>
            </div>

            <div class="form-group">
                <label for="regEmail">Email Address</label>
                <input type="email" id="regEmail" placeholder="Enter your email address" required>
                <small class="error-message" id="regEmailError"></small>
            </div>

            <div class="form-group">
                <label for="regSkill">Select Technical Skill</label>
                <select id="regSkill" required>
                    <option value="">-- Select Skill --</option>
                    <option value="html">HTML5</option>
                    <option value="css">CSS3</option>
                    <option value="javascript">JavaScript (ES6+)</option>
                    <option value="git">Git & GitHub</option>
                    <option value="responsive">Responsive Design</option>
                </select>
                <small class="error-message" id="regSkillError"></small>
            </div>

            <div class="form-group">
                <label for="regDay">Preferred Day</label>
                <select id="regDay" required>
                    <option value="">-- Select Preferred Day --</option>
                    <option value="Monday">Monday</option>
                    <option value="Wednesday">Wednesday</option>
                    <option value="Friday">Friday</option>
                    <option value="Saturday">Saturday</option>
                </select>
                <small class="error-message" id="regDayError"></small>
            </div>

            <div class="form-group">
                <label for="regTime">Preferred Time Slot</label>
                <select id="regTime" required>
                    <option value="">-- Select Time Slot --</option>
                    <option value="10:00 AM - 11:30 AM">10:00 AM - 11:30 AM</option>
                    <option value="03:00 PM - 04:30 PM">03:00 PM - 04:30 PM</option>
                    <option value="08:00 PM - 09:30 PM">08:00 PM - 09:30 PM</option>
                </select>
                <small class="error-message" id="regTimeError"></small>
            </div>

            <button type="submit" class="btn primary-btn">Confirm Registration</button>
            <div id="regSuccess" class="success-message"></div>
        </form>
    </section>

    <footer>
        <p>&copy; 2026 Md. Amdadul Islam. Built with Vanilla Web Standards.</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
